<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #efe2c6; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }
  .content { position: relative; z-index: 1; color: #252220; font-family: "Courier New", monospace;
             text-align: center; padding-top: 30vh; pointer-events: none; letter-spacing: 0.08em; }
  .content h1 { font-size: 3rem; margin: 0; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<script>
// ---------- Settings you can play with ----------
const CELL = 10;          // grid size in pixels
const LEVELS = 16;        // number of contour lines
const RADIUS = 120;       // reach of the mouse effect (px)
const PUSH = 0.6;         // how strongly the mouse pushes the lines
const MAX_PUSH = 400;     // cap on how far a point can be pushed in total
const SPEED = 0.2;        // drift speed of the background
const HALFTONE_BAND = 0.4;   // how far (in "level units") halftone dots reach from a line
const DOT_MAX = 2.6;         // biggest halftone dot radius (px)

// Colours
const BG = '#efe2c6';        // cream
const LINE = '#ff4f38';      // orange
const LINE_BOLD = '#ff4b4b'; // deeper orange for every 4th line
const DOTS = '#ffb399';      // brown halftone

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, cols, rows, field, dispX, dispY;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  cols = Math.ceil(W / CELL) + 1;
  rows = Math.ceil(H / CELL) + 1;
  field = new Float32Array(cols * rows);
  dispX = new Float32Array(cols * rows);   // permanent push (x) at each grid point
  dispY = new Float32Array(cols * rows);   // permanent push (y) at each grid point
}
addEventListener('resize', resize);
resize();
addEventListener('dblclick', () => { dispX.fill(0); dispY.fill(0); });

// ---------- Mouse tracking ----------
let mx = -999, my = -999, vx = 0, vy = 0, lastX = null, lastY = null;
addEventListener('pointermove', e => {
  if (lastX !== null) { vx += e.clientX - lastX; vy += e.clientY - lastY; }
  lastX = mx = e.clientX; lastY = my = e.clientY;
});

// ---------- The "terrain" ----------
function height(x, y, t) {
  return Math.sin(x * 0.006 + t)
       + Math.sin(y * 0.008 - t * 0.7)
       + Math.sin((x + y) * 0.005 + t * 0.5)
       + Math.sin(Math.hypot(x - W / 2, y - H / 2) * 0.007 - t * 0.8);
}

// ---------- Marching squares ----------
// Edges: 0 = top, 1 = right, 2 = bottom, 3 = left
const SEGMENTS = [
  [], [[3,2]], [[2,1]], [[3,1]], [[0,1]], [[0,3],[2,1]], [[0,2]], [[0,3]],
  [[0,3]], [[0,2]], [[0,1],[3,2]], [[0,1]], [[3,1]], [[2,1]], [[3,2]], []
];

function drawContours(level) {
  ctx.beginPath();
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols - 1; i++) {
      const p = j * cols + i;
      const a = field[p], b = field[p + 1];
      const d = field[p + cols], c = field[p + cols + 1];
      const idx = (a > level) * 8 + (b > level) * 4 + (c > level) * 2 + (d > level);
      if (idx === 0 || idx === 15) continue;
      const x = i * CELL, y = j * CELL;
      const pts = [
        [x + CELL * (level - a) / (b - a), y],
        [x + CELL, y + CELL * (level - b) / (c - b)],
        [x + CELL * (level - d) / (c - d), y + CELL],
        [x, y + CELL * (level - a) / (d - a)]
      ];
      for (const [e1, e2] of SEGMENTS[idx]) {
        ctx.moveTo(pts[e1][0], pts[e1][1]);
        ctx.lineTo(pts[e2][0], pts[e2][1]);
      }
    }
  }
  ctx.stroke();
}

// ---------- Halftone dots just below each contour line ----------
// Dots get bigger the closer they are to the line above them.
function drawHalftone(min, max) {
  const span = max - min;
  ctx.fillStyle = DOTS;
  ctx.beginPath();
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const v = (field[j * cols + i] - min) / span * (LEVELS + 1);  // 1.0 = first line, 2.0 = second...
      const frac = v - Math.floor(v);          // 0..1 within the current band
      const dist = 1 - frac;                   // distance up to the next line
      if (dist > HALFTONE_BAND || v < 1 || v > LEVELS + 1) continue;
      const r = (1 - dist / HALFTONE_BAND) * DOT_MAX;
      if (r < 0.4) continue;
      const x = i * CELL + (j % 2) * CELL / 2; // stagger every other row like a real halftone screen
      const y = j * CELL;
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }
  }
  ctx.fill();
}

// ---------- Animation loop ----------
function frame(ms) {
  const t = ms * 0.001 * SPEED;

  // 1. Mouse movement permanently pushes nearby grid points (no fading)
  if (vx || vy) {
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const dx = i * CELL - mx, dy = j * CELL - my;
        const falloff = Math.exp(-(dx * dx + dy * dy) / (RADIUS * RADIUS));
        if (falloff < 0.01) continue;
        const p = j * cols + i;
        dispX[p] = Math.max(-MAX_PUSH, Math.min(MAX_PUSH, dispX[p] + vx * PUSH * falloff));
        dispY[p] = Math.max(-MAX_PUSH, Math.min(MAX_PUSH, dispY[p] + vy * PUSH * falloff));
      }
    }
    vx = vy = 0;
  }

  // 2. Height at every grid point, shifted by the permanent push
  let min = Infinity, max = -Infinity;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const p = j * cols + i;
      const v = height(i * CELL - dispX[p], j * CELL - dispY[p], t);
      field[p] = v;
      if (v < min) min = v; if (v > max) max = v;
    }
  }

  // 3. Draw: cream background, halftone dots, then contour lines on top
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  drawHalftone(min, max);
  for (let n = 1; n <= LEVELS; n++) {
    const bold = n % 4 === 0;                  // every 4th line is thicker, like a topo map
    ctx.lineWidth = bold ? 2.0 : 1.2;
    ctx.strokeStyle = bold ? LINE_BOLD : LINE;
    drawContours(min + (max - min) * n / (LEVELS + 1));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
