<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PenPal WebSocket</title>
</head>
<body>
  <button id="connect">Connect</button>
  <button id="clear">Clear</button>
  <button id="download" disabled>Download G-code</button>
  <p id="status" role="status">Disconnected</p>
  <p id="completion-status" role="status"></p>
  <p id="gcode-status" role="status"></p>
  <p id="plot-status" role="status"></p>
  <canvas id="canvas" width="640" height="480" style="border: 1px solid #ccc; max-width: 100%;"></canvas>

  <script>
    const button = document.getElementById("connect");
    const status = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    const completionStatus = document.getElementById("completion-status");
    const download = document.getElementById("download");
    const gcodeStatus = document.getElementById("gcode-status");
    const plotStatus = document.getElementById("plot-status");
    let history = [];
    let completion = Promise.resolve();
    let drawingVersion = 0;
    let gcode = "";
    let plottingPaused = false;

    function clearDownload() {
      gcode = "";
      download.disabled = true;
      gcodeStatus.textContent = "";
    }

    download.onclick = () => {
      const url = URL.createObjectURL(new Blob([gcode], { type: "text/plain" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "penpal.gcode";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    };

    function drawPoint(point, previous, color = "black") {
      const [x, y] = point;
      context.lineWidth = 4;
      context.lineCap = "round";
      context.strokeStyle = color;
      context.fillStyle = color;
      context.beginPath();
      if (previous) {
        context.moveTo(previous[0], previous[1]);
        context.lineTo(x, y);
        context.stroke();
      } else {
        context.arc(x, y, 2, 0, Math.PI * 2);
        context.fill();
      }
    }

    async function fetchAndDrawCompletion(version) {
      const response = await fetch("http://localhost:8000/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ strokes: history, width: canvas.width, height: canvas.height }),
      });
      const result = await response.json();

      if (version !== drawingVersion) return;
      if (!response.ok) throw new Error(result.error);
      for (const path of result.strokes) {
        path.forEach((point, i) => drawPoint(point, path[i - 1], "blue"));
      }
      history.push(...result.strokes);
      gcode = result.gcode;
      download.disabled = !gcode;
      gcodeStatus.textContent = result.warnings.length
        ? result.warnings.join("\n")
        : gcode ? "G-code ready for the latest model continuation." : "No new lines to export.";
      completionStatus.textContent = "";
      if (gcode && !result.warnings.length && !plottingPaused) await plotGcode(gcode);
    }

    async function plotGcode(code) {
      plotStatus.textContent = "Plotting… Clear only clears the canvas; it does not stop the plotter.";
      try {
        const response = await fetch("http://localhost:8000/plot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gcode: code }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        plotStatus.textContent = "Plot complete.";
      } catch (error) {
        plottingPaused = true;
        plotStatus.textContent = `Automatic plotting paused: ${error.message}. The job may be partially drawn. Wait for the plotter to stop, restore its home position, then reload the page to resume.`;
      }
    }

    function clearDrawing() {
      drawingVersion += 1;
      history = [];
      completionStatus.textContent = "";
      clearDownload();
      context.clearRect(0, 0, canvas.width, canvas.height);
    }

    document.getElementById("clear").onclick = clearDrawing;

    async function completeDrawing(version) {
      if (version !== drawingVersion) return;
      clearDownload();
      completionStatus.textContent = "Completing...";
      try {
        await fetchAndDrawCompletion(version);
        if (version === drawingVersion) completionStatus.textContent = "";
      } catch (error) {
        if (version === drawingVersion) completionStatus.textContent = error.message;
      }
    }

    button.onclick = () => {
      button.disabled = true;
      status.textContent = "Connecting...";
      const socket = new WebSocket("ws://localhost:8765");
      let currentStroke = null;

      socket.onopen = () => {
        status.textContent = "Connected";
      };

      socket.onmessage = (event) => {
        const { type, pen_down, x, y, width, height } = JSON.parse(event.data);
        if (type === "COMPLETE") {
          currentStroke = null;
          const version = drawingVersion;
          completion = completion.then(() => completeDrawing(version));
          return;
        }
        if (!pen_down) {
          currentStroke = null;
          return;
        }

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          clearDrawing();
          currentStroke = null;
        }

        if (!currentStroke || history[history.length - 1] !== currentStroke) {
          currentStroke = [];
          history.push(currentStroke);
        }
        drawPoint([x, y], currentStroke[currentStroke.length - 1]);
        currentStroke.push([x, y]);
      };

      socket.onclose = (event) => {
        currentStroke = null;
        status.textContent = event.code === 1006
          ? "Connection failed or lost. Check that the server is running."
          : "Disconnected";
        button.disabled = false;
      };
    };
  </script>
</body>
</html>
